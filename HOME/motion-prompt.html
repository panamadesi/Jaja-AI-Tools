<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAJA AI TOOLS - Motion Prompt</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/extra.css">
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<meta name="description" content="Prompt video AI untuk Wan, Seedance, Kling, dan Veo.">
<meta property="og:type" content="website">
<meta property="og:title" content="JAJA AI TOOLS - Motion Prompt Generator">
<meta property="og:description" content="Prompt video AI untuk Wan, Seedance, Kling, dan Veo.">
<meta property="og:image" content="https://panamadesi.github.io/Jaja-AI-Tools/assets/header.png">
<meta property="og:url" content="https://panamadesi.github.io/Jaja-AI-Tools/HOME/motion-prompt.html">
<meta name="twitter:card" content="summary_large_image">
</head>

<body>

<div class="container">

<header class="header">
    <img src="../assets/header.png" class="header-banner">
</header>

<nav class="menu-bar" id="nav"></nav>

<div class="main">

    <div class="left-panel">

        <div class="card">
            <h2>Target Model</h2>
            <select id="model"></select>
            <small id="modelNote"></small>
        </div>

        <div class="card">
            <h2>Subject &amp; Scene</h2>
            <textarea id="subject" rows="3" placeholder="Contoh: a young Sundanese woman in a green kebaya"></textarea>
            <select id="action"></select>
            <select id="scene"></select>
        </div>

        <div class="card">
            <h2>Camera</h2>
            <select id="shot"></select>
            <select id="camera"></select>
            <select id="speed"></select>
        </div>

        <div class="card">
            <h2>Look</h2>
            <select id="style"></select>
            <select id="light"></select>
            <select id="duration"></select>
            <select id="aspect"></select>
            <select id="audio"></select>
        </div>

    </div>

    <div class="right-panel">

        <div class="card">
            <h2>Motion Prompt</h2>
            <textarea id="hasil" placeholder="Prompt akan muncul di sini..."></textarea>
            <h2 style="margin-top:18px">Negative Prompt</h2>
            <textarea id="negatif" rows="3"></textarea>
            <div class="button-group">
                <button id="generateBtn">🚀 Generate</button>
                <button id="randomBtn">🎲 Random</button>
                <button id="copyBtn">📋 Copy</button>
                <button id="exportBtn">💾 Export TXT</button>
            </div>
        </div>

        <div class="card">
            <h2>Tips</h2>
            <p id="tips" style="line-height:1.6"></p>
        </div>

    </div>

</div>

</div>

<script src="../js/common.js"></script>

<script src="../js/motion.js"></script>

<script src="../js/persist.js"></script>

</body>
</html>
